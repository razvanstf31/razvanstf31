<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#1b1f3a"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; }
      .tag { font-family: 'Courier New', monospace; font-size: 13px; fill: #5eead4; }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
      .slide { opacity: 0; animation: slide .8s ease-out forwards; }
      @keyframes slide { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#bgc)" stroke="url(#g)" stroke-width="2" class="glow"/>

  <g transform="translate(70 52) scale(0.5)">
    <path d="M56 0 L168 0 C198.928 0 224 25.072 224 56 L224 168 C224 198.928 198.928 224 168 224 L56 224 C25.072 224 0 198.928 0 168 L0 56 C0 25.072 25.072 0 56 0 Z" fill="#de3e18"/>
    <path d="M101.703 80.825 L115.63 80.825 C119.517 80.825 123.052 83.077 124.695 86.599 L129.974 97.917 C131.768 101.765 137.238 101.766 139.035 97.92 L157.407 58.594 C159.051 55.074 162.584 52.825 166.469 52.825 L180.396 52.825 C187.714 52.825 192.555 60.426 189.46 67.057 L143.569 165.395 C139.976 173.093 129.03 173.092 125.44 165.393 L92.638 95.055 C89.545 88.423 94.386 80.825 101.703 80.825 Z M43.598 52.825 L57.536 52.825 C61.419 52.825 64.952 55.074 66.594 58.593 L105.529 141.999 C106.779 144.677 106.78 147.772 105.53 150.452 L98.558 165.403 C94.97 173.098 84.03 173.099 80.44 165.406 L34.539 67.049 C31.447 60.421 36.285 52.825 43.598 52.825 Z" fill="#ffffff"/>
  </g>

  <g class="t">
    <text class="slide" style="animation-delay:.2s" x="230" y="70" font-size="32" font-weight="800" fill="#ffffff">Web Vektor</text>
    <text class="slide" style="animation-delay:.4s" x="230" y="102" font-size="17" fill="#c9d1d9">Digital agency: websites, online stores, web apps and hosting.</text>
    <text class="slide tag" style="animation-delay:.6s" x="230" y="135">Astro · Tailwind · Node · PostgreSQL</text>
  </g>

  <!-- button -->
  <g class="slide" style="animation-delay:.8s">
    <rect x="230" y="158" width="170" height="38" rx="19" fill="url(#g)"/>
    <text class="t" x="315" y="182" text-anchor="middle" font-size="15" font-weight="700" fill="#0d1117">▶ webvektor.ro</text>
