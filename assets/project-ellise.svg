26.76 C 117.02 136.98 120.64 143.82 126.83 145.8 C 130.44 146.96 132.54 147.04 167.83 147.52 C 173.68 147.6 175.18 148.13 177.23 150.86 C 180.89 155.72 182.46 167.74 180.26 174.14 C 178.84 178.29 176.31 182.7 173.69 185.58 C 169.4 190.3 169.42 190.09 173.04 193.58 C 182.62 202.81 182.01 213.7 171.1 228.42 C 167.69 233.02 165.97 236.82 165.21 241.4 C 164.73 244.32 164.34 244.58 162.68 243.07 Z" fill-rule="evenodd"/>
  <path id="pSash" d="M 155.05 302.83 C 154.74 302.35 154.56 301.05 154.32 297.64 C 154.01 293.15 153.78 291.82 152.56 287.79 C 150.06 279.53 142.78 266.38 136.03 257.96 C 131.14 251.86 126.09 245.8 123.84 243.33 C 122.59 241.96 121.2 240.31 120.76 239.67 C 120.33 239.03 119.54 238.17 119.02 237.76 C 118.5 237.34 116.78 235.57 115.2 233.81 C 113.62 232.05 110.59 228.75 108.46 226.47 C 106.33 224.19 103.18 220.75 101.46 218.84 C 99.74 216.92 97.31 214.22 96.07 212.84 C 71.79 185.91 61.97 169.26 63.45 157.53 C 64.31 150.76 65.73 147.87 70.75 142.67 C 73.69 139.62 80.19 137.64 81.66 139.35 C 82.43 140.24 82.32 141.22 80.97 145.64 C 79.01 152.02 79.09 151.55 79.08 157.83 C 79.08 163.37 79.11 163.68 79.78 166.08 C 81.11 170.84 83.66 175.34 88.06 180.71 C 89.24 182.15 91.17 184.59 92.33 186.12 C 95.92 190.84 108.54 202.1 112.48 204.09 C 113.22 204.47 115.33 205.84 117.16 207.14 C 119 208.44 122.03 210.54 123.91 211.81 C 129.99 215.91 135.3 219.56 136.71 220.61 C 137.46 221.17 139.49 222.62 141.21 223.84 C 148.85 229.26 158.42 237.16 162.74 241.62 C 165.61 244.58 168.46 250.48 170.31 257.26 C 173.71 269.75 171.14 284.96 164.19 293.46 C 163.35 294.49 161.69 296.73 160.5 298.44 C 157.04 303.41 155.99 304.26 155.05 302.83 Z" fill-rule="evenodd"/>
  <clipPath id="cMan"><use xlink:href="#pMan"/></clipPath>
  <clipPath id="cSash"><use xlink:href="#pSash"/></clipPath>

  <linearGradient id="gMan" gradientUnits="userSpaceOnUse" x1="20" y1="10" x2="190" y2="335"><stop offset="0" stop-color="#FFFDFA"/><stop offset="0.45" stop-color="#FBF7F2"/><stop offset="1" stop-color="#E3D8CB"/></linearGradient>
  <linearGradient id="gSash" gradientUnits="userSpaceOnUse" x1="50" y1="130" x2="175" y2="305"><stop offset="0" stop-color="#C48F78"/><stop offset="0.5" stop-color="#AD7860"/><stop offset="1" stop-color="#8A5D49"/></linearGradient>
  <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="130" y2="190">
    <stop offset="0" stop-color="#fff" stop-opacity="0.12"/><stop offset="0.55" stop-color="#fff" stop-opacity="0.03"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>

  <!-- glass: rim light + inner glow + inner shadow (light from the top-left, like the background) -->
  <filter id="glass" x="-12%" y="-12%" width="124%" height="124%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="1.1" result="b"/>
    <feSpecularLighting in="b" surfaceScale="3" specularConstant="1.1" specularExponent="30" lighting-color="#FFFFFF" result="spec">
      <feDistantLight azimuth="225" elevation="40"/>
    </feSpecularLighting>
    <feComposite in="spec" in2="SourceAlpha" operator="in" result="specIn"/>
    <feSpecularLighting in="b" surfaceScale="3" specularConstant="0.6" specularExponent="26" lighting-color="#D9B58F" result="bounce">
      <feDistantLight azimuth="45" elevation="36"/>
    </feSpecularLighting>
    <feComposite in="bounce" in2="SourceAlpha" operator="in" result="bounceIn"/>
    <feComponentTransfer in="SourceAlpha" result="inv"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
    <feGaussianBlur in="inv" stdDeviation="2.4" result="invB"/>
    <feFlood flood-color="#FFFFFF" flood-opacity="0.35"/>
    <feComposite in2="invB" operator="in" result="glowC"/>
    <feComposite in="glowC" in2="SourceAlpha" operator="in" result="glow"/>
    <feGaussianBlur in="inv" stdDeviation="2.2" result="invB2"/>
    <feOffset in="invB2" dx="-2.6" dy="-3.8" result="invO"/>
    <feFlood flood-color="#000" flood-opacity="0.42"/>
    <feComposite in2="invO" operator="in" result="shC"/>
    <feComposite in="shC" in2="SourceAlpha" operator="in" result="innerShadow"/>
    <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="glow"/><feMergeNode in="innerShadow"/><feMergeNode in="bounceIn"/><feMergeNode in="specIn"/></feMerge>
  </filter>
  <filter id="drop" x="-30%" y="-20%" width="160%" height="150%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="8.5"/>
    <feOffset dx="3" dy="12"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.8"/></feComponentTransfer>
  </filter>
  <filter id="contact" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
    <feGaussianBlur in="SourceAlpha" stdDeviation="3.4"/>
    <feOffset dx="2.2" dy="4.5"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>
</defs>

<rect width="1024" height="1024" fill="url(#bg)"/>

<g transform="translate(260.8 94.9) scale(2.35)">
  <use xlink:href="#pMan"  fill="#000" filter="url(#drop)"/>
  <use xlink:href="#pSash" fill="#000" filter="url(#drop)" opacity="0.8"/>

  <use xlink:href="#pMan" fill="url(#gMan)" filter="url(#glass)"/>
  <g clip-path="url(#cMan)"><use xlink:href="#pMan" fill="url(#sheen)"/></g>

  <g clip-path="url(#cMan)"><use xlink:href="#pSash" fill="#000" filter="url(#contact)"/></g>

  <use xlink:href="#pSash" fill="url(#gSash)" filter="url(#glass)"/>
  <g clip-path="url(#cSash)"><use xlink:href="#pSash" fill="url(#sheen)" opacity="0.9"/></g>
</g>
</svg>
  </g>

  <g class="t">
