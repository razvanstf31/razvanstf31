<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/><stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="bgc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b22"/><stop offset="1" stop-color="#1b1f3a"/>
    </linearGradient>
    <style>
      .t { font-family: 'Segoe UI', Arial, sans-serif; }
      .tag { font-family: 'Courier New', monospace; font-size: 13px; fill: #5eead4; }
      .glow { animation: glow 3s ease-in-out infinite; }
      @keyframes glow { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
      .slide { opacity: 0; animation: slide .8s ease-out forwards; }
      @keyframes slide { from { opacity: 0; transform: translateX(-24px); } to { opacity: 1; transform: translateX(0); } }
    </style>
  </defs>
  <rect x="2" y="2" width="896" height="216" rx="16" fill="url(#bgc)" stroke="url(#g)" stroke-width="2" class="glow"/>

  <clipPath id="ellClip"><rect x="70" y="52" width="112" height="112" rx="26"/></clipPath>
  <g clip-path="url(#ellClip)">
  <svg x="70" y="52" width="112" height="112" viewBox="0 0 1024 1024">

<defs>
    <radialGradient id="bg" gradientUnits="userSpaceOnUse" cx="260" cy="170" r="1200">
      <stop offset="0"   stop-color="#1F1B18"/>
      <stop offset="0.45" stop-color="#110F0D"/>
      <stop offset="1"   stop-color="#070605"/>
    </radialGradient>
