<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="140" viewBox="0 0 1000 140">
  <defs>
    <linearGradient id="w" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b7bff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".55"/>
    </linearGradient>
  </defs>
  <path fill="url(#w)" d="M0 70 Q 125 30 250 70 T 500 70 T 750 70 T 1000 70 T 1250 70 T 1500 70 V140 H0Z">
    <animateTransform attributeName="transform" type="translate" values="0 0;-500 0" dur="10s" repeatCount="indefinite"/>
  </path>
  <path fill="url(#w)" opacity=".5" d="M0 90 Q 125 120 250 90 T 500 90 T 750 90 T 1000 90 T 1250 90 T 1500 90 V140 H0Z">
    <animateTransform attributeName="transform" type="translate" values="-500 0;0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <text x="500" y="60" text-anchor="middle" font-family="'Courier New', monospace" font-size="18" fill="#c9d1d9">
    Always learning. Always building.
    <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite"/>
  </text>
</svg>
