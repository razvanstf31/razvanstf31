<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #e6edf3; text-anchor: middle; }
      .pill { fill: #161b22; stroke-width: 1.5; }
      .float { animation: float 3.6s ease-in-out infinite; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
      .in { opacity: 0; animation: in .7s ease-out forwards; }
      @keyframes in { to { opacity: 1; } }
    </style>
  </defs>
  <rect width="900" height="260" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- row 1 -->
  <g class="in" style="animation-delay:.1s"><g class="float" style="animation-delay:0s"><rect class="pill" x="60"  y="40" width="120" height="44" rx="22" stroke="#f7df1e"/><text x="120" y="68">JavaScript</text></g></g>
  <g class="in" style="animation-delay:.2s"><g class="float" style="animation-delay:.3s"><rect class="pill" x="200" y="40" width="120" height="44" rx="22" stroke="#3178c6"/><text x="260" y="68">TypeScript</text></g></g>
  <g class="in" style="animation-delay:.3s"><g class="float" style="animation-delay:.6s"><rect class="pill" x="340" y="40" width="100" height="44" rx="22" stroke="#61dafb"/><text x="390" y="68">React</text></g></g>
  <g class="in" style="animation-delay:.4s"><g class="float" style="animation-delay:.9s"><rect class="pill" x="460" y="40" width="110" height="44" rx="22" stroke="#ffffff"/><text x="515" y="68">Next.js</text></g></g>
  <g class="in" style="animation-delay:.5s"><g class="float" style="animation-delay:1.2s"><rect class="pill" x="590" y="40" width="110" height="44" rx="22" stroke="#3c873a"/><text x="645" y="68">Node.js</text></g></g>
  <g class="in" style="animation-delay:.6s"><g class="float" style="animation-delay:1.5s"><rect class="pill" x="720" y="40" width="120" height="44" rx="22" stroke="#06b6d4"/><text x="780" y="68">Tailwind</text></g></g>

  <!-- row 2 -->
  <g class="in" style="animation-delay:.7s"><g class="float" style="animation-delay:.2s"><rect class="pill" x="110" y="110" width="90" height="44" rx="22" stroke="#00599c"/><text x="155" y="138">C++</text></g></g>
  <g class="in" style="animation-delay:.8s"><g class="float" style="animation-delay:.5s"><rect class="pill" x="220" y="110" width="100" height="44" rx="22" stroke="#ffd43b"/><text x="270" y="138">Python</text></g></g>
  <g class="in" style="animation-delay:.9s"><g class="float" style="animation-delay:.8s"><rect class="pill" x="340" y="110" width="90" height="44" rx="22" stroke="#e34f26"/><text x="385" y="138">HTML</text></g></g>
  <g class="in" style="animation-delay:1s"><g class="float" style="animation-delay:1.1s"><rect class="pill" x="450" y="110" width="90" height="44" rx="22" stroke="#1572b6"/><text x="495" y="138">CSS</text></g></g>
  <g class="in" style="animation-delay:1.1s"><g class="float" style="animation-delay:1.4s"><rect class="pill" x="560" y="110" width="110" height="44" rx="22" stroke="#8b7bff"/><text x="615" y="138">Supabase</text></g></g>
  <g class="in" style="animation-delay:1.2s"><g class="float" style="animation-delay:1.7s"><rect class="pill" x="690" y="110" width="100" height="44" rx="22" stroke="#336791"/><text x="740" y="138">SQL</text></g></g>

  <!-- row 3 -->
  <g class="in" style="animation-delay:1.3s"><g class="float" style="animation-delay:.4s"><rect class="pill" x="270" y="180" width="90" height="44" rx="22" stroke="#f05032"/><text x="315" y="208">Git</text></g></g>
  <g class="in" style="animation-delay:1.4s"><g class="float" style="animation-delay:.7s"><rect class="pill" x="380" y="180" width="110" height="44" rx="22" stroke="#e6edf3"/><text x="435" y="208">GitHub</text></g></g>
  <g class="in" style="animation-delay:1.5s"><g class="float" style="animation-delay:1s"><rect class="pill" x="510" y="180" width="110" height="44" rx="22" stroke="#ffffff"/><text x="565" y="208">Vercel</text></g></g>
</svg>
